<body class="bg-surface-container-low text-on-surface font-body-lg min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline fixed top-0 w-full z-50 flex justify-between items-center w-full px-margin-mobile h-12">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional headshot of a friendly young executive in a corporate setting, soft daylight coming from a large window, blurred office background with minimalist furniture, high-end photography style, maintaining the SpendWise brand calm and reliable aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJDzCXUX2zvdM89i7N4U7m-vQpZWQkvsPQnpHVeaE5mMRoK60eX9MdSSbD5J0vYZ7wd5pACk7erkzqnDBaYHoX1ucjPWZazBIl4Y_nYntF1XvfkX7n_AUZrXMN_ApynGcWmaba_WadMTyvVxv_SBVW4HGvVgRdnFZ2a12zTENJjadBoIu5o_qTb7QOUBmB2nKXjXHYFP5OFLXeWXCOj0B4RgXsUdJ5BjPKl0bTYD5U4c7YGFHwc8ICs-64x3e_FHb38EeOOfZtNQ-i"/>
</div>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">SpendWise</span>
</div>
<button class="material-symbols-outlined text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors p-2 rounded-full">notifications</button>
</header>
<!-- Main Content -->
<main class="pt-20 px-margin-mobile flex justify-center">
<div class="w-full max-w-[600px] bg-white rounded-xl shadow-sm border border-outline-variant p-6 mb-8">
<!-- Toggle Section -->
<div class="flex bg-surface-container p-1 rounded-lg mb-8">
<button class="flex-1 py-3 px-4 rounded-md font-label-md text-label-md transition-all duration-200 bg-error-container text-error font-bold shadow-sm" id="toggle-expense" onclick="setTransactionType('expense')">
                    Expense
                </button>
<button class="flex-1 py-3 px-4 rounded-md font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:bg-surface-container-high" id="toggle-income" onclick="setTransactionType('income')">
                    Income
                </button>
</div>
<!-- Large Amount Input -->
<div class="text-center mb-10">
<p class="font-label-md text-label-md text-on-surface-variant mb-2">Total Amount</p>
<div class="relative flex items-center justify-center">
<span class="text-4xl font-numeric-display text-primary mr-2">$</span>
<input class="numeric-input-large w-full max-w-[240px] text-center border-none focus:ring-0 text-5xl font-bold font-numeric-display text-on-surface placeholder-outline-variant bg-transparent" placeholder="0.00" type="number"/>
</div>
<div class="w-32 h-1 bg-primary-container/20 mx-auto mt-2 rounded-full"></div>
</div>
<!-- Form Fields -->
<div class="space-y-6">
<!-- Date Picker -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 ml-1">Date</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none bg-surface-container-lowest" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Category Dropdown -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 ml-1">Category</label>
<select class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none bg-surface-container-lowest appearance-none cursor-pointer">
<option value="food">🍔 Food</option>
<option value="transport">🚌 Transport</option>
<option value="entertainment">🎮 Entertainment</option>
<option value="rent">🏠 Rent</option>
<option value="health">💊 Health</option>
<option value="education">📚 Education</option>
<option value="shopping">🛍️ Shopping</option>
<option value="custom">➕ Add Custom</option>
</select>
</div>
<!-- Description -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2 ml-1">Description (Optional)</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none bg-surface-container-lowest" placeholder="What was this for?" type="text"/>
</div>
<!-- Payment Method -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-3 ml-1">Payment Method</label>
<div class="flex flex-wrap gap-3">
<label class="flex-1 min-w-[80px] cursor-pointer group">
<input checked="" class="sr-only peer" name="payment" type="radio" value="cash"/>
<div class="h-11 flex items-center justify-center rounded-lg border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-surface-container-high transition-all text-body-sm font-label-md">
                                Cash
                            </div>
</label>
<label class="flex-1 min-w-[80px] cursor-pointer group">
<input class="sr-only peer" name="payment" type="radio" value="upi"/>
<div class="h-11 flex items-center justify-center rounded-lg border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-surface-container-high transition-all text-body-sm font-label-md">
                                UPI
                            </div>
</label>
<label class="flex-1 min-w-[80px] cursor-pointer group">
<input class="sr-only peer" name="payment" type="radio" value="card"/>
<div class="h-11 flex items-center justify-center rounded-lg border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-surface-container-high transition-all text-body-sm font-label-md">
                                Card
                            </div>
</label>
<label class="flex-1 min-w-[80px] cursor-pointer group">
<input class="sr-only peer" name="payment" type="radio" value="bank"/>
<div class="h-11 flex items-center justify-center rounded-lg border border-outline-variant peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-surface-container-high transition-all text-body-sm font-label-md">
                                Transfer
                            </div>
</label>
</div>
</div>
<!-- CTA -->
<button class="w-full h-14 bg-primary-container text-on-primary-container rounded-lg font-label-md text-headline-md font-bold shadow-md hover:bg-primary transition-all active:scale-[0.98] mt-4 flex items-center justify-center gap-2">
                    Save Transaction
                </button>
</div>
</div>
</main>

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-2 py-2 pb-safe bg-surface dark:bg-surface-dim border-t border-outline-variant dark:border-outline">
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-tertiary-container text-on-primary-container dark:text-on-tertiary-container rounded-xl px-4 py-1 active:scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-weight="fill">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md text-label-md">History</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="font-label-md text-label-md">Budgets</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</nav>
<script>
        function setTransactionType(type) {
            const expBtn = document.getElementById('toggle-expense');
            const incBtn = document.getElementById('toggle-income');
            
            if (type === 'expense') {
                expBtn.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-high');
                expBtn.classList.add('bg-error-container', 'text-error', 'font-bold', 'shadow-sm');
                
                incBtn.classList.add('text-on-surface-variant', 'hover:bg-surface-container-high');
                incBtn.classList.remove('bg-tertiary-fixed', 'text-tertiary', 'font-bold', 'shadow-sm');
            } else {
                incBtn.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-high');
                incBtn.classList.add('bg-tertiary-fixed', 'text-tertiary', 'font-bold', 'shadow-sm');
                
                expBtn.classList.add('text-on-surface-variant', 'hover:bg-surface-container-high');
                expBtn.classList.remove('bg-error-container', 'text-error', 'font-bold', 'shadow-sm');
            }
        }

        // Initialize with today's date
        window.onload = function() {
            const dateInput = document.querySelector('input[type="date"]');
            if(dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
            }
        }
    </script>
